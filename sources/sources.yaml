# primary_wire sources
# This is the master list of organizations tracked by primary_wire.
#
# Format:
#   slug:                short unique identifier used in CSV data files
#   name:                full display name of the organization
#   ticker:              stock ticker symbol (omit for non-public sources)
#   ir_url:               the official investor relations page. This is also
#                         the base URL scrapers use to find press releases,
#                         UNLESS news_url (below) is set.
#   news_url:             base URL for the press-release listing, if and only
#                         if it lives on a different host than ir_url. Optional
#                         -- omit entirely for the common case where ir_url's
#                         own host serves both the IR page and the press
#                         releases. Set this only for the exceptions (e.g. IBM:
#                         ir_url is https://www.ibm.com/investor but releases
#                         are at https://newsroom.ibm.com/announcements; Lockheed Martin:
#                         ir_url is https://investors.lockheedmartin.com but
#                         releases are at https://news.lockheedmartin.com/news-releases).
#                         Every scraper resolves its actual base URL as
#                         "news_url if set, else ir_url" -- see
#                         utils.sources_utils.resolve_scrape_url() -- so
#                         nothing else in this file changes meaning based on
#                         whether news_url is present.
#   news_releases_path:  path appended to the resolved scrape URL's host
#                         (news_url if set, else ir_url) for the press-release
#                         listing page, e.g. "press-releases". Optional --
#                         omit to use the scraper's default ("news-releases").
#                         Only meaningful for scrape_investorroom.py and
#                         scrape_notified.py; other scrapers ignore it.
#   first_page_index:    the site's own starting page number for its ?page=
#                         pagination parameter. Optional -- omit to use the
#                         default (0). Only meaningful for
#                         scrape_notified.py; scrape_investorroom.py paginates
#                         by item offset (?o=), which has no equivalent
#                         starting-index quirk, and other scrapers ignore it.
#   notes:                any useful context about finding press releases
#   needs_detail_page_dates: true if this source's Q4 IR listing page does not
#                         embed a publish date in its news cards, so scrape_q4_ir.py
#                         must fetch each item's individual detail page to find one
#                         (equivalent to always passing --fetch-detail-pages).
#                         Optional -- omit to use the default (false). Only
#                         meaningful for scrape_q4_ir.py; other scrapers ignore it.
#                         This is a durable fact about the site's Q4 theme, not a
#                         per-run behavior choice, so it lives here rather than as
#                         an 'args' override in config/scraper_config.yaml.
#   news_path:            listing path appended to the resolved scrape URL
#                         (news_url if set, else ir_url) for a Q4 IR site, e.g.
#                         "investor-news-and-events/financial-releases/{year}/default.aspx"
#                         for Netflix. Optional -- omit to use the default
#                         ("news/default.aspx", e.g. Costco/CDW). Include a
#                         literal "{year}" path segment for themes whose listing
#                         URL is year-specific; scrape_q4_ir.py fills it in per
#                         --year (or drops it for the undated default view).
#                         Only meaningful for scrape_q4_ir.py; other scrapers
#                         ignore it.
#   news_details_segment: the "-details" path segment used by this Q4 theme's
#                         press-release detail links in place of "news-details",
#                         e.g. "press-release-details" for Netflix. Optional --
#                         omit to use the default ("news-details", e.g.
#                         Costco/CDW). Only meaningful for scrape_q4_ir.py;
#                         other scrapers ignore it.

